<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무환전 (武幻傳)</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="무환전">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16130f; --ink-2:#1e1a14; --paper:#e9dfc4; --paper-dark:#d9c9a0;
    --seal:#9c2b2b; --seal-dark:#7a1f1f; --gold:#c9a24b; --jade:#4f6b58;
    --text-dark:#2b241a; --text-light:#efe6cf; --fs:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(ellipse at 20% 10%, rgba(201,162,75,0.06), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(79,107,88,0.08), transparent 55%), var(--ink);
    font-family:'Noto Serif KR', serif; color:var(--text-light);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 14px;
  }
  .stage{ width:100%; max-width:640px; }
  .titlebar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px; gap:8px; }
  .gametitle{ font-family:'Song Myung', serif; font-size:22px; letter-spacing:4px; color:var(--gold); text-shadow:0 0 18px rgba(201,162,75,0.25); }
  .titlebar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{ width:40px;height:40px;border-radius:8px;border:1px solid rgba(201,162,75,0.35); background:rgba(30,26,20,0.5); color:var(--gold); display:flex;align-items:center;justify-content:center; font-size:18px; cursor:pointer; flex-shrink:0; }
  .seal{ width:46px;height:46px;border:2px solid var(--seal);border-radius:6px;background:rgba(156,43,43,0.12); display:flex;align-items:center;justify-content:center; font-family:'Song Myung', serif; font-size:20px; color:var(--seal); transform:rotate(-3deg); flex-shrink:0; }
  .card{ background:linear-gradient(180deg, var(--paper) 0%, var(--paper-dark) 100%); color:var(--text-dark); border-radius:3px;
    box-shadow:0 18px 40px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(43,36,26,0.15); padding:26px 24px 22px; position:relative; overflow:hidden; }
  .card::before{ content:""; position:absolute; inset:8px; border:1px solid rgba(43,36,26,0.18); pointer-events:none; }
  .chapter-eyebrow{ font-size:calc(12px*var(--fs)); letter-spacing:3px; color:var(--seal-dark); font-weight:600; margin-bottom:4px; }
  .chapter-title{ font-family:'Song Myung', serif; font-size:calc(20px*var(--fs)); margin:0 0 14px; color:var(--text-dark); border-bottom:1px solid rgba(43,36,26,0.25); padding-bottom:10px; }
  .narrative{ min-height:24px; }
  .narrative p{ line-height:1.85; font-size:calc(15.5px*var(--fs)); margin:0 0 14px; color:var(--text-dark); }
  .narrative.typing{ cursor:pointer; }
  .stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0 6px; }
  .stat{ background:rgba(43,36,26,0.06); border:1px solid rgba(43,36,26,0.15); border-radius:4px; padding:8px 6px; text-align:center; }
  .stat .label{ font-size:calc(11px*var(--fs)); color:var(--seal-dark); letter-spacing:1px; font-weight:600; }
  .stat .value{ font-family:'Song Myung',serif; font-size:calc(18px*var(--fs)); margin-top:2px; color:var(--text-dark); }
  .actions{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .btn{ font-family:'Noto Serif KR', serif; text-align:left; background:var(--ink-2); color:var(--text-light);
    border:1px solid rgba(201,162,75,0.35); padding:13px 16px; border-radius:3px; cursor:pointer; font-size:calc(14.5px*var(--fs)); line-height:1.5;
    transition:background .15s ease, border-color .15s ease, transform .1s ease; }
  .btn:hover{ background:#282019; border-color:var(--gold); }
  .btn:active{ transform:scale(0.99); }
  .btn .tag{ display:inline-block; font-size:calc(11px*var(--fs)); color:var(--gold); margin-right:8px; letter-spacing:1px; }
  .btn.primary{ background:var(--seal-dark); border-color:var(--seal); text-align:center; font-weight:600; }
  .btn.primary:hover{ background:var(--seal); }
  .btn.ghost{ background:transparent; border-color:rgba(43,36,26,0.3); color:var(--text-dark); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn small{ display:block; font-size:calc(11.5px*var(--fs)); opacity:0.65; margin-top:2px; font-weight:400; }

  .combat-wrap{ margin-top:6px; }
  .vs-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .fighter{ flex:1; text-align:center; }
  .fighter .name{ font-family:'Song Myung',serif; font-size:calc(15px*var(--fs)); color:var(--text-dark); margin-bottom:6px; }
  .fighter.enemy .name{ color:var(--seal-dark); }
  .hpbar-outer{ height:12px; background:rgba(43,36,26,0.15); border-radius:8px; overflow:hidden; border:1px solid rgba(43,36,26,0.25); }
  .hpbar-inner{ height:100%; background:linear-gradient(90deg, var(--jade), #6b8f76); transition:width .35s ease; }
  .fighter.enemy .hpbar-inner{ background:linear-gradient(90deg, var(--seal-dark), var(--seal)); }
  .hp-num{ font-size:calc(11px*var(--fs)); margin-top:4px; color:rgba(43,36,26,0.7); }
  .vs-mark{ font-family:'Song Myung',serif; font-size:20px; color:var(--seal-dark); }
  .log{ background:rgba(43,36,26,0.06); border:1px solid rgba(43,36,26,0.15); border-radius:4px; padding:10px 12px; height:96px; overflow-y:auto;
    font-size:calc(13px*var(--fs)); line-height:1.6; color:var(--text-dark); margin-bottom:14px; }
  .log div{ margin-bottom:2px; }
  .combat-actions{ display:grid; grid-template-columns:repeat(auto-fit, minmax(84px,1fr)); gap:8px; }
  .combat-actions .btn{ text-align:center; font-size:calc(12.8px*var(--fs)); padding:11px 4px; }

  .footer-note{ text-align:center; font-size:11.5px; color:rgba(239,230,207,0.35); margin-top:14px; letter-spacing:0.5px; }
  .fade-in{ animation:fadeIn .45s ease both; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  body.reduce-motion .fade-in{ animation:none; }
  @media (prefers-reduced-motion: reduce){ .fade-in{ animation:none; } }

  .section-label{ font-size:calc(12px*var(--fs)); letter-spacing:2px; color:var(--seal-dark); font-weight:700; margin:18px 0 8px; text-transform:uppercase; }
  .section-label:first-child{ margin-top:0; }
  .swatch-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{ width:44px;height:44px;border-radius:50%;cursor:pointer;border:2px solid rgba(43,36,26,0.25); position:relative; }
  .swatch.active::after{ content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; text-shadow:0 0 3px rgba(0,0,0,0.6); }
  .seg-row{ display:flex; gap:6px; }
  .seg-btn{ flex:1; text-align:center; padding:9px 4px; border-radius:4px; cursor:pointer; border:1px solid rgba(43,36,26,0.25); background:rgba(43,36,26,0.05); font-size:calc(13px*var(--fs)); color:var(--text-dark); }
  .seg-btn.active{ background:var(--seal-dark); border-color:var(--seal-dark); color:var(--text-light); font-weight:600; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(43,36,26,0.12); }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle-row .toggle-label{ font-size:calc(14px*var(--fs)); color:var(--text-dark); }
  .switch{ width:44px;height:24px;border-radius:12px;background:rgba(43,36,26,0.2);position:relative;cursor:pointer;flex-shrink:0; transition:background .15s ease; }
  .switch.on{ background:var(--seal-dark); }
  .switch .knob{ position:absolute; top:2px; left:2px; width:20px;height:20px;border-radius:50%; background:var(--paper); transition:left .15s ease; }
  .switch.on .knob{ left:22px; }
  .name-input{ width:100%; padding:10px 12px; border-radius:4px; border:1px solid rgba(43,36,26,0.3); background:rgba(43,36,26,0.05);
    font-family:'Noto Serif KR',serif; font-size:calc(14.5px*var(--fs)); color:var(--text-dark); margin-bottom:4px; }
  .hint{ font-size:calc(11.5px*var(--fs)); color:rgba(43,36,26,0.6); margin-bottom:4px; }
  .stat-alloc-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; }
  .stat-alloc-row .sa-label{ font-size:calc(14px*var(--fs)); font-weight:600; color:var(--text-dark); width:56px; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .step-btn{ width:30px;height:30px;border-radius:50%; border:1px solid rgba(43,36,26,0.3); background:rgba(43,36,26,0.06); color:var(--text-dark); font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center; }
  .step-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .step-val{ min-width:24px; text-align:center; font-family:'Song Myung',serif; font-size:calc(16px*var(--fs)); }
  .pool-remain{ text-align:center; margin:10px 0 4px; font-size:calc(13px*var(--fs)); color:var(--seal-dark); font-weight:600; }
  .danger-btn{ border-color:var(--seal); color:var(--seal-dark); background:transparent; }
  .danger-btn:hover{ background:rgba(156,43,43,0.08); }

  .badge-row{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
  .badge{ font-size:calc(11px*var(--fs)); padding:4px 9px; border-radius:12px; background:rgba(43,36,26,0.08); border:1px solid rgba(43,36,26,0.18); color:var(--text-dark); }
  .badge.accent{ background:var(--seal-dark); color:var(--text-light); border-color:var(--seal-dark); }
  .loc-desc{ font-size:calc(13.5px*var(--fs)); line-height:1.7; color:rgba(43,36,26,0.85); margin:8px 0 6px; }
  .skill-item{ padding:10px 0; border-bottom:1px solid rgba(43,36,26,0.12); }
  .skill-item:last-child{ border-bottom:none; }
  .skill-item .sname{ font-family:'Song Myung',serif; font-size:calc(15px*var(--fs)); color:var(--text-dark); }
  .skill-item .sdesc{ font-size:calc(12.5px*var(--fs)); color:rgba(43,36,26,0.65); margin-top:2px; }
  .empty-note{ font-size:calc(13.5px*var(--fs)); color:rgba(43,36,26,0.55); padding:10px 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="titlebar">
    <div class="gametitle">武幻傳 · 무환전</div>
    <div class="titlebar-right">
      <div class="icon-btn" id="gearBtn" title="설정">⚙</div>
      <div class="seal" id="sealMark">武</div>
    </div>
  </div>
  <div class="card fade-in" id="card"></div>
  <div class="footer-note">강호는 끝나지 않는다 · 선택이 곧 삶이 된다</div>
</div>

<script>
(function(){

  const SAVE_KEY = "muhwan_open_save_v1";
  const SETTINGS_KEY = "muhwan_settings_v1";
  const FONT_SCALES = { sm:0.88, md:1, lg:1.16, xl:1.32 };
  const THEMES = {
    ink:   { "--ink":"#16130f","--ink-2":"#1e1a14","--paper":"#e9dfc4","--paper-dark":"#d9c9a0","--seal":"#9c2b2b","--seal-dark":"#7a1f1f","--gold":"#c9a24b","--jade":"#4f6b58","--text-dark":"#2b241a","--text-light":"#efe6cf", label:"묵향", swatch:"#9c2b2b" },
    jade:  { "--ink":"#10150f","--ink-2":"#161f16","--paper":"#dfe8d4","--paper-dark":"#c8d6ba","--seal":"#3f6b46","--seal-dark":"#2e4f34","--gold":"#b7a35a","--jade":"#6b8f76","--text-dark":"#1f261e","--text-light":"#e6efe0", label:"벽옥", swatch:"#3f6b46" },
    azure: { "--ink":"#0d1420","--ink-2":"#131c29","--paper":"#dbe6ee","--paper-dark":"#c2d3e0","--seal":"#2f5f8a","--seal-dark":"#20486a","--gold":"#8fb3c9","--jade":"#4f6b58","--text-dark":"#16202b","--text-light":"#e3edf4", label:"청연", swatch:"#2f5f8a" },
    violet:{ "--ink":"#160f1a","--ink-2":"#1e1524","--paper":"#e6dcec","--paper-dark":"#d1c1da","--seal":"#6b3f8a","--seal-dark":"#4f2c66","--gold":"#b79ad0","--jade":"#4f6b58","--text-dark":"#241a2b","--text-light":"#efe3f5", label:"자하", swatch:"#6b3f8a" },
  };
  const TEXT_SPEED_MS = { instant:0, normal:16, slow:34 };
  const DEFAULT_STATS = { 내공:10, 무공:10, 명성:5, 의리:5 };
  const STAT_POOL_TOTAL = 30, STAT_MIN = 3, STAT_MAX = 15;
  const CLUE_TARGET = 5;

  // ---------- 설정 ----------
  let settings = loadSettings();
  function loadSettings(){
    try{ const raw = localStorage.getItem(SETTINGS_KEY); if(raw) return Object.assign({ fontSize:"md", theme:"ink", sound:true, textSpeed:"normal", reduceMotion:false }, JSON.parse(raw)); }catch(e){}
    return { fontSize:"md", theme:"ink", sound:true, textSpeed:"normal", reduceMotion:false };
  }
  function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
  function applySettings(){
    const t = THEMES[settings.theme] || THEMES.ink;
    const root = document.documentElement;
    Object.keys(t).forEach(k=>{ if(k.startsWith("--")) root.style.setProperty(k, t[k]); });
    root.style.setProperty("--fs", FONT_SCALES[settings.fontSize] || 1);
    document.body.classList.toggle("reduce-motion", !!settings.reduceMotion);
  }

  // ---------- 사운드 ----------
  let actx = null;
  function ctx(){ if(!settings.sound) return null; if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } return actx; }
  function playTone(freq,dur,type,vol,delay){
    if(!settings.sound) return; const ac = ctx(); if(!ac) return;
    const t0=ac.currentTime+(delay||0); const osc=ac.createOscillator(); const gain=ac.createGain();
    osc.type=type||"sine"; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0); gain.gain.linearRampToValueAtTime(vol||0.14,t0+0.012); gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain); gain.connect(ac.destination); osc.start(t0); osc.stop(t0+dur+0.02);
  }
  const sfx = {
    click:()=>playTone(320,0.05,"sine",0.10),
    attack:()=>playTone(160,0.11,"square",0.10),
    skill:()=>{ playTone(420,0.09,"triangle",0.12); playTone(640,0.14,"triangle",0.10,0.06); },
    hit:()=>playTone(120,0.09,"sawtooth",0.09),
    win:()=>{ playTone(392,0.12,"triangle",0.12,0); playTone(494,0.12,"triangle",0.12,0.12); playTone(659,0.22,"triangle",0.14,0.24); },
    lose:()=>{ playTone(220,0.25,"sawtooth",0.10,0); playTone(160,0.35,"sawtooth",0.10,0.18); },
    get:()=>{ playTone(500,0.1,"triangle",0.12,0); playTone(750,0.16,"triangle",0.12,0.1); },
  };

  function clamp(n,min,max){ return Math.max(min===undefined?0:min, Math.min(max===undefined?99:max, n)); }
  function withName(text, name){ if(!text) return text; return text.split("무환").join(name||"무환"); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // ---------- 무공(스킬) ----------
  const SKILLS = {
    gangjang: { id:"gangjang", name:"대력금강장(大力金剛掌)", desc:"강맹한 일격기. 전투 중 1회, 큰 피해를 입힌다.",
      combat:true, use:(st)=>({ dmg: 20+Math.round(st.stats.무공*0.9), log:`${st.playerName}이(가) 대력금강장을 펼친다!` }) },
    yuwoon: { id:"yuwoon", name:"유운검법(流雲劍法)", desc:"검격 후 내식을 순환시킨다. 피해와 함께 소량 회복.",
      combat:true, use:(st)=>({ dmg: 12+Math.round(st.stats.무공*0.5), heal: Math.round(st.stats.내공*0.35), log:`${st.playerName}이(가) 유운검법을 펼친다.` }) },
    buwoon: { id:"buwoon", name:"부운신법(浮雲身法)", desc:"경공의 극치. 전투 중 1회, 적의 공격을 완전히 흘려낸다.",
      combat:true, evade:true, use:(st)=>({ dmg: 4+Math.round(st.stats.무공*0.2), log:`${st.playerName}이(가) 부운신법으로 몸을 흘린다.` }) },
    cheonli: { id:"cheonli", name:"천리전음(千里傳音)", desc:"강호의 소식을 먼저 듣는다. 탐색 중 단서를 더 잘 찾아낸다.", combat:false, passive:"clue" },
  };
  const SKILL_ORDER = ["gangjang","yuwoon","buwoon","cheonli"];

  // ---------- 문파 ----------
  const SECTS = {
    소림: { name:"소림사", trainStat:{무공:3,내공:2}, flavor:"불문의 무공은 육중하고 견고하다." },
    무당: { name:"무당파", trainStat:{내공:3,무공:2}, flavor:"도가의 무공은 부드럽되 끊이지 않는다." },
    개방: { name:"개방", trainStat:{의리:3,명성:2}, flavor:"거지들의 정보망은 강호의 그 무엇보다 빠르다." },
    화산: { name:"화산파", trainStat:{무공:3,명성:1}, flavor:"매화처럼 매섭고 아름다운 검이 전해진다." },
    아미: { name:"아미파", trainStat:{내공:2,의리:2}, flavor:"부드러움 속에 강함을 품은 무공이 전해진다." },
    곤륜: { name:"곤륜파", trainStat:{내공:3,무공:1}, flavor:"속세를 벗어난 설산의 검이 전해진다." },
    종남: { name:"종남파", trainStat:{무공:2,의리:2}, flavor:"협의를 무엇보다 앞세우는 문파다." },
    청성: { name:"청성파", trainStat:{무공:3,내공:1}, flavor:"안개처럼 스며드는 검법이 전해진다." },
    점창: { name:"점창파", trainStat:{무공:2,명성:2}, flavor:"실전에서 태어난 도검술이 전해진다." },
    공동: { name:"공동파", trainStat:{무공:2,내공:2}, flavor:"변화무쌍한 장법이 전해진다." },
  };

  // ---------- 지역 ----------
  const LOCATIONS = {
    market:   { name:"낙양 저잣거리", desc:"오가는 상인과 낭인들로 늘 북적이는 곳. 소문과 물건이 함께 떠돈다." },
    inn:      { name:"낙양 객잔", desc:"먼 길 떠난 무인들이 술잔을 기울이며 강호의 이야기를 나눈다." },
    wild:     { name:"관도와 산길", desc:"인적 드문 길. 기연과 위험이 함께 도사린다." },
    shaolin:  { name:"소림사", desc:"숭산 깊은 곳, 천 년의 무학이 쌓인 선종의 본산." },
    wudang:   { name:"무당파", desc:"구름 위에 선 도관, 유(柔)로 강(剛)을 다스리는 도가의 성지." },
    gaebang:  { name:"개방 총타", desc:"낡은 사당이지만, 이곳을 거쳐가지 않는 강호의 소식은 없다." },
    hwasan:   { name:"화산파", desc:"깎아지른 절벽 위, 매화가 흩날리는 검의 성지." },
    emei:     { name:"아미파", desc:"여승들이 지키는 산문, 유연하면서도 매서운 무공이 전해진다." },
    kunlun:   { name:"곤륜파", desc:"설산 깊은 곳, 세상과 동떨어진 검의 문파." },
    zhongnan: { name:"종남파", desc:"속세와 가까운 도가 문파, 협의를 중시한다." },

  };
  const LOCATION_ORDER = ["market","inn","wild","shaolin","wudang","gaebang","hwasan","emei","kunlun","zhongnan","qingcheng","dianchang","kongtong"];

  // ---------- 적 풀 ----------
  const WILD_ENEMIES = [
    { name:"떠돌이 낭인", hp:28, atk:5 },
    { name:"수적 무리의 척후", hp:32, atk:5 },
    { name:"이름 모를 낭인 검객", hp:36, atk:6 },
    { name:"실력을 뽐내는 후기지수", hp:30, atk:6 },
  ];

  // ---------- 상태 ----------
  let state = null;
  function freshState(){
    return {
      stats: { ...DEFAULT_STATS }, playerName:"무환",
      skills:[], sect:null, clues:0, turn:0,
      location:"market", usedEvents:[], lastEventId:{},
      flags:{ introDone:false, canConfront:false, revengeDone:false, revengeWon:false },
      screen:"title", prevScreenSnapshot:null,
      scene:null, combat:null,
    };
  }
  state = freshState();
  let allocDraft = { ...DEFAULT_STATS };
  let nameDraft = "무환";

  function loadSave(){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) return JSON.parse(raw); }catch(e){} return null; }
  function persistSave(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        stats:state.stats, playerName:state.playerName, skills:state.skills, sect:state.sect,
        clues:state.clues, turn:state.turn, location:state.location, usedEvents:state.usedEvents,
        lastEventId:state.lastEventId, flags:state.flags,
      }));
    }catch(e){}
  }
  function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

  // ---------- 타자기 ----------
  let typingTimer = null;
  function revealParagraphs(container, paragraphs, onDone){
    container.innerHTML = ""; container.classList.add("typing");
    const speed = TEXT_SPEED_MS[settings.textSpeed] ?? 16;
    const pEls = paragraphs.map(()=>{ const p=document.createElement("p"); container.appendChild(p); return p; });
    if(speed===0){ pEls.forEach((el,i)=>el.textContent=paragraphs[i]); container.classList.remove("typing"); if(onDone) onDone(); return; }
    let pi=0, ci=0, finished=false;
    function finishAll(){ if(finished) return; finished=true; clearInterval(typingTimer); pEls.forEach((el,i)=>el.textContent=paragraphs[i]); container.classList.remove("typing"); if(onDone) onDone(); }
    typingTimer = setInterval(()=>{
      if(pi>=paragraphs.length){ finishAll(); return; }
      const text=paragraphs[pi]; ci++; pEls[pi].textContent=text.slice(0,ci);
      if(ci>=text.length){ pi++; ci=0; }
    }, speed);
    container.onclick = finishAll;
  }

  const cardEl = document.getElementById('card');
  const sealEl = document.getElementById('sealMark');
  const gearBtn = document.getElementById('gearBtn');
  function fadeCard(){ cardEl.classList.remove('fade-in'); void cardEl.offsetWidth; cardEl.classList.add('fade-in'); }
  function statsRowHTML(){
    const order=["내공","무공","명성","의리"];
    return '<div class="stats-row">'+order.map(k=>`<div class="stat"><div class="label">${k}</div><div class="value">${state.stats[k]}</div></div>`).join('')+'</div>';
  }
  function badgeRowHTML(){
    let b = [];
    b.push(`<span class="badge accent">${state.sect ? SECTS[state.sect].name : "독행협"}</span>`);
    b.push(`<span class="badge">단서 ${state.clues}/${CLUE_TARGET}</span>`);
    if(state.skills.length) b.push(`<span class="badge">무공 ${state.skills.length}식</span>`);
    if(state.flags.revengeDone) b.push(`<span class="badge accent">복수 완료</span>`);
    return `<div class="badge-row">${b.join('')}</div>`;
  }

  // =========================================================
  // 타이틀 / 설정 / 새 게임
  // =========================================================
  function renderTitle(){
    fadeCard(); sealEl.textContent = "武";
    const hasSave = !!loadSave();
    cardEl.innerHTML = `
      <div class="chapter-eyebrow">OPEN WUXIA LIFE RPG</div>
      <h2 class="chapter-title">무환전 (武幻傳)</h2>
      <div class="narrative"><p>정해진 끝은 없다. 강호를 떠돌며 사람을 만나고, 무공을 익히고, 문파에 몸을 담거나 홀로 원수를 쫓아라.</p></div>
      <div class="actions">
        ${hasSave ? '<button class="btn primary" id="continueBtn">이어하기</button>' : ''}
        <button class="btn ${hasSave?'ghost':'primary'}" id="newGameBtn">새로 시작</button>
        <button class="btn ghost" id="settingsBtn">설정</button>
      </div>
    `;
    if(hasSave){
      document.getElementById('continueBtn').onclick = ()=>{
        sfx.click();
        const s = loadSave();
        state = Object.assign(freshState(), s);
        state.screen = state.flags.introDone ? "hub" : "title";
        if(!state.flags.introDone){ openSetupIntroResume(); return; }
        renderHub();
      };
    }
    document.getElementById('newGameBtn').onclick = ()=>{ sfx.click(); openSetup(); };
    document.getElementById('settingsBtn').onclick = ()=>{ sfx.click(); openSettings(); };
  }

  function openSetup(){ state = freshState(); nameDraft="무환"; allocDraft={...DEFAULT_STATS}; state.screen="setup"; renderSetup(); }
  function openSetupIntroResume(){ openSetup(); }
  function allocRemain(){ return STAT_POOL_TOTAL - Object.values(allocDraft).reduce((a,b)=>a+b,0); }
  function renderSetup(){
    fadeCard(); sealEl.textContent="少";
    const order=["내공","무공","명성","의리"];
    cardEl.innerHTML = `
      <div class="chapter-eyebrow">NEW GAME</div>
      <h2 class="chapter-title">새로운 협객의 시작</h2>
      <div class="section-label">주인공 이름</div>
      <input type="text" class="name-input" id="nameInput" maxlength="8" value="${nameDraft}">
      <div class="hint">강호에 새겨질 이름을 정하세요 (기본: 무환)</div>
      <div class="section-label">시작 자질 배분</div>
      <div class="hint">총 ${STAT_POOL_TOTAL}포인트, 항목당 ${STAT_MIN}~${STAT_MAX}</div>
      <div id="allocRows"></div>
      <div class="pool-remain" id="poolRemain"></div>
      <div class="actions">
        <button class="btn primary" id="startBtn">이야기 시작하기</button>
        <button class="btn ghost" id="backFromSetup">뒤로</button>
      </div>
    `;
    const rowsEl = document.getElementById('allocRows');
    order.forEach(k=>{
      const row=document.createElement('div'); row.className='stat-alloc-row';
      row.innerHTML = `<div class="sa-label">${k}</div><div class="stepper">
        <button class="step-btn" data-k="${k}" data-d="-1">−</button>
        <div class="step-val" id="val-${k}">${allocDraft[k]}</div>
        <button class="step-btn" data-k="${k}" data-d="1">+</button></div>`;
      rowsEl.appendChild(row);
    });
    function refreshAlloc(){
      order.forEach(k=>document.getElementById('val-'+k).textContent = allocDraft[k]);
      const r = allocRemain();
      document.getElementById('poolRemain').textContent = r===0 ? "배분 완료 ✓" : `남은 포인트: ${r}`;
      document.getElementById('startBtn').disabled = (r!==0);
      rowsEl.querySelectorAll('.step-btn').forEach(b=>{
        const k=b.dataset.k, d=parseInt(b.dataset.d,10);
        if(d>0) b.disabled = (allocDraft[k]>=STAT_MAX) || (allocRemain()<=0);
        else b.disabled = (allocDraft[k]<=STAT_MIN);
      });
    }
    rowsEl.querySelectorAll('.step-btn').forEach(b=>{
      b.onclick=()=>{ const k=b.dataset.k, d=parseInt(b.dataset.d,10); const next=allocDraft[k]+d;
        if(next<STAT_MIN||next>STAT_MAX) return; if(d>0&&allocRemain()<=0) return;
        allocDraft[k]=next; sfx.click(); refreshAlloc(); };
    });
    document.getElementById('nameInput').oninput=(e)=>{ nameDraft=e.target.value.trim()||"무환"; };
    refreshAlloc();
    document.getElementById('startBtn').onclick=()=>{
      if(allocRemain()!==0) return; sfx.click();
      state.stats={...allocDraft}; state.playerName=nameDraft||"무환";
      persistSave();
      startScene(INTRO_NODES, ()=>{ state.flags.introDone=true; state.location="market"; persistSave(); renderHub(); });
    };
    document.getElementById('backFromSetup').onclick=()=>{ sfx.click(); state.screen="title"; renderTitle(); };
  }

  function openSettings(){ state.prevScreenSnapshot = state.screen; state.screen="settings"; renderSettings(); }
  function renderSettings(){
    fadeCard(); sealEl.textContent="設";
    const fsOrder=[["sm","작게"],["md","보통"],["lg","크게"],["xl","아주크게"]];
    const spOrder=[["instant","즉시"],["normal","보통"],["slow","천천히"]];
    cardEl.innerHTML = `
      <div class="chapter-eyebrow">SETTINGS</div>
      <h2 class="chapter-title">설정</h2>
      <div class="section-label">글자 크기</div>
      <div class="seg-row" id="fsRow">${fsOrder.map(([k,l])=>`<div class="seg-btn ${settings.fontSize===k?'active':''}" data-k="${k}">${l}</div>`).join('')}</div>
      <div class="section-label">테마 색상</div>
      <div class="swatch-row" id="themeRow">${Object.keys(THEMES).map(k=>`<div class="swatch ${settings.theme===k?'active':''}" data-k="${k}" style="background:${THEMES[k].swatch}" title="${THEMES[k].label}"></div>`).join('')}</div>
      <div class="section-label">텍스트 표시 속도</div>
      <div class="seg-row" id="spRow">${spOrder.map(([k,l])=>`<div class="seg-btn ${settings.textSpeed===k?'active':''}" data-k="${k}">${l}</div>`).join('')}</div>
      <div class="hint">진행 중인 텍스트를 탭하면 바로 전체가 표시됩니다.</div>
      <div class="section-label">기타</div>
      <div class="toggle-row"><div class="toggle-label">사운드 효과음</div><div class="switch ${settings.sound?'on':''}" id="soundToggle"><div class="knob"></div></div></div>
      <div class="toggle-row"><div class="toggle-label">애니메이션 줄이기</div><div class="switch ${settings.reduceMotion?'on':''}" id="motionToggle"><div class="knob"></div></div></div>
      <div class="section-label">진행 데이터</div>
      <div class="hint">진행 상황은 이 기기에 자동 저장됩니다.</div>
      <div class="actions"><button class="btn danger-btn" id="resetBtn">진행 상황 초기화</button></div>
      <div class="actions"><button class="btn primary" id="backFromSettings">뒤로가기</button></div>
    `;
    document.getElementById('fsRow').querySelectorAll('.seg-btn').forEach(b=>b.onclick=()=>{ settings.fontSize=b.dataset.k; saveSettings(); applySettings(); sfx.click(); renderSettings(); });
    document.getElementById('themeRow').querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{ settings.theme=b.dataset.k; saveSettings(); applySettings(); sfx.click(); renderSettings(); });
    document.getElementById('spRow').querySelectorAll('.seg-btn').forEach(b=>b.onclick=()=>{ settings.textSpeed=b.dataset.k; saveSettings(); sfx.click(); renderSettings(); });
    document.getElementById('soundToggle').onclick=()=>{ settings.sound=!settings.sound; saveSettings(); if(settings.sound) sfx.click(); renderSettings(); };
    document.getElementById('motionToggle').onclick=()=>{ settings.reduceMotion=!settings.reduceMotion; saveSettings(); applySettings(); sfx.click(); renderSettings(); };
    document.getElementById('resetBtn').onclick=()=>{
      if(confirm("정말로 진행 상황을 초기화할까요? 되돌릴 수 없습니다.")){ clearSave(); state=freshState(); renderTitle(); }
    };
    document.getElementById('backFromSettings').onclick=()=>{
      sfx.click(); const back=state.prevScreenSnapshot||"title"; state.screen=back;
      if(back==="title") renderTitle();
      else if(back==="setup") renderSetup();
      else if(back==="hub") renderHub();
      else renderHub();

  // =========================================================
  // 씬(scene) 엔진 — text / choice / combat 노드를 순서대로 재생
  // =========================================================
  function startScene(nodes, onComplete){
    state.screen = "scene";
    state.scene = { nodes, idx:0, onComplete };
    renderSceneNode();
  }
  function sceneAdvance(){
    state.scene.idx++;
    if(state.scene.idx >= state.scene.nodes.length){
      const cb = state.scene.onComplete; state.scene = null;
      if(cb) cb();
      return;
    }
    renderSceneNode();
  }
  function renderSceneNode(){
    fadeCard();
    const node = state.scene.nodes[state.scene.idx];
    if(node.type === "text"){
      const body = node.body.map(t=>withName(t, state.playerName));
      cardEl.innerHTML = `
        <div class="chapter-eyebrow">${node.eyebrow||"강호"}</div>
        ${node.title?`<h2 class="chapter-title">${node.title}</h2>`:''}
        <div class="narrative" id="narBox"></div>
        ${statsRowHTML()}
        <div class="actions"><button class="btn primary" id="nextBtn">다음</button></div>
      `;
      revealParagraphs(document.getElementById('narBox'), body);
      document.getElementById('nextBtn').onclick=()=>{ sfx.click(); sceneAdvance(); };
    }
    else if(node.type === "choice"){
      cardEl.innerHTML = `
        <div class="chapter-eyebrow">${node.eyebrow||"강호"}</div>
        ${node.title?`<h2 class="chapter-title">${node.title}</h2>`:''}
        <p style="font-weight:600;margin-bottom:14px;">${withName(node.prompt, state.playerName)}</p>
        <div class="actions" id="choiceActions"></div>
      `;
      const wrap = document.getElementById('choiceActions');
      node.options.forEach(opt=>{
        const b=document.createElement('button'); b.className='btn';
        b.innerHTML = `${opt.tag?`<span class="tag">[${opt.tag}]</span>`:''}${withName(opt.label, state.playerName)}`;
        b.onclick=()=>{
          sfx.click();
          if(opt.effects) applyEffects(opt.effects);
          if(opt.onSelect) opt.onSelect();
          if(opt.result){ showInlineResult(node, withName(opt.result, state.playerName)); }
          else sceneAdvance();
        };
        wrap.appendChild(b);
      });
    }
    else if(node.type === "combat"){
      startCombat(node);
    }
  }
  function showInlineResult(node, text){
    fadeCard();
    cardEl.innerHTML = `
      <div class="chapter-eyebrow">${node.eyebrow||"강호"}</div>
      ${node.title?`<h2 class="chapter-title">${node.title}</h2>`:''}
      <div class="narrative" id="narBox"></div>
      ${statsRowHTML()}
      <div class="actions"><button class="btn primary" id="nextBtn">다음</button></div>
    `;
    revealParagraphs(document.getElementById('narBox'), [text]);
    document.getElementById('nextBtn').onclick=()=>{ sfx.click(); sceneAdvance(); };
  }
  function applyEffects(effects){
    if(!effects) return;
    for(const k in effects){
      if(k==="clues"){ state.clues = clamp(state.clues+effects[k], 0, 99); continue; }
      if(state.stats[k]!==undefined) state.stats[k] = clamp(state.stats[k]+effects[k], 0, 99);
    }
  }
  function learnSkill(id){ if(!state.skills.includes(id)) state.skills.push(id); }

  // =========================================================
  // 전투 엔진 (학습한 무공을 추가 행동으로 사용 가능)
  // =========================================================
  function startCombat(node){
    state.combat = {
      playerHp: Math.round(40 + state.stats.내공*1.4), enemyHp:node.enemy.hp, enemyMaxHp:node.enemy.hp,
      enemyAtk:node.enemy.atk, enemyName:node.enemy.name, skillCharges:2,
      usedSkills:{}, log:[`${node.enemy.name}(이)가 나타났다!`], node:node, over:false,
    };
    state.combat.playerMaxHp = state.combat.playerHp;
    renderCombat();
  }
  function pushLog(msg){ state.combat.log.push(msg); if(state.combat.log.length>40) state.combat.log.shift(); }
  function renderCombat(){
    fadeCard();
    const c = state.combat;
    const pPct = Math.max(0, Math.round(100*c.playerHp/c.playerMaxHp));
    const ePct = Math.max(0, Math.round(100*c.enemyHp/c.enemyMaxHp));
    const combatSkills = state.skills.filter(id=>SKILLS[id] && SKILLS[id].combat);

    cardEl.innerHTML = `
      <div class="chapter-eyebrow">전투</div>
      <h2 class="chapter-title">${c.enemyName}과(와)의 대결</h2>
      <div class="combat-wrap">
        <div class="vs-row">
          <div class="fighter"><div class="name">${state.playerName}</div>
            <div class="hpbar-outer"><div class="hpbar-inner" style="width:${pPct}%"></div></div>
            <div class="hp-num">${Math.max(0,Math.round(c.playerHp))} / ${Math.round(c.playerMaxHp)}</div></div>
          <div class="vs-mark">對</div>
          <div class="fighter enemy"><div class="name">${c.enemyName}</div>
            <div class="hpbar-outer"><div class="hpbar-inner" style="width:${ePct}%"></div></div>
            <div class="hp-num">${Math.max(0,Math.round(c.enemyHp))} / ${Math.round(c.enemyMaxHp)}</div></div>
        </div>
        <div class="log" id="combatLog">${c.log.map(l=>`<div>${withName(l, state.playerName)}</div>`).join('')}</div>
        <div class="combat-actions" id="combatActions"></div>
      </div>
    `;
    const log = document.getElementById('combatLog'); log.scrollTop = log.scrollHeight;
    if(c.over) return;
    const actWrap = document.getElementById('combatActions');
    function makeBtn(label, onClick, disabled){
      const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.disabled=!!disabled; b.onclick=onClick; return b;
    }
    actWrap.appendChild(makeBtn("공격", ()=>playerAction('attack')));
    actWrap.appendChild(makeBtn("방어", ()=>playerAction('defend')));
    actWrap.appendChild(makeBtn(`필살기 (${c.skillCharges})`, ()=>playerAction('skill'), c.skillCharges<=0));
    combatSkills.forEach(id=>{
      const used = !!c.usedSkills[id];
      actWrap.appendChild(makeBtn(SKILLS[id].name.split('(')[0], ()=>playerAction('learned', id), used));
    });
  }
  function playerAction(action, skillId){
    const c = state.combat; if(c.over) return;
    let playerDmg=0, defending=false, heal=0;
    if(action==='attack'){ sfx.attack(); playerDmg = 6+Math.round(state.stats.무공*0.6)+Math.floor(Math.random()*5);
      pushLog(`${state.playerName}이(가) 검을 휘두른다 — ${c.enemyName}에게 ${playerDmg}의 피해!`); }
    else if(action==='defend'){ sfx.click(); defending=true; pushLog(`${state.playerName}이(가) 자세를 낮추고 방어에 집중한다.`); }
    else if(action==='skill'){ if(c.skillCharges<=0) return; sfx.skill(); c.skillCharges--;
      playerDmg = 14+Math.round(state.stats.무공*0.8)+Math.round(state.stats.내공*0.4);
      pushLog(`${state.playerName}이(가) 청운문의 절기를 펼친다! ${c.enemyName}에게 ${playerDmg}의 큰 피해!`); }
    else if(action==='learned'){
      const sk = SKILLS[skillId]; if(!sk || c.usedSkills[skillId]) return;
      sfx.skill(); c.usedSkills[skillId]=true;
      const r = sk.use(state);
      playerDmg = r.dmg||0; heal = r.heal||0;
      pushLog(withName(r.log, state.playerName));
      if(sk.evade) defending = true;
      if(heal>0){ c.playerHp = Math.min(c.playerMaxHp, c.playerHp+heal); pushLog(`${state.playerName}의 상처가 소량 회복된다. (+${heal})`); }
    }
    c.enemyHp -= playerDmg;
    if(c.enemyHp<=0){
      c.enemyHp=0; c.over=true; pushLog(`${c.enemyName}(이)가 쓰러졌다!`);
      renderCombat(); sfx.win();
      setTimeout(()=>endCombat(true), 850); return;
    }
    let enemyDmg = c.enemyAtk + Math.floor(Math.random()*5);
    if(defending) enemyDmg = Math.round(enemyDmg * (action==='learned' ? 0.05 : 0.4));
    c.playerHp -= enemyDmg;
    pushLog(`${c.enemyName}(이)가 반격한다 — ${state.playerName}이(가) ${enemyDmg}의 피해를 입었다.`);
    if(playerDmg>0) sfx.hit();
    if(c.playerHp<=0){
      c.playerHp=0; c.over=true; pushLog(`${state.playerName}이(가) 크게 다쳤다…`);
      renderCombat(); sfx.lose();
      setTimeout(()=>endCombat(false), 850); return;
    }
    renderCombat();
  }
  function endCombat(won){
    const node = state.combat.node;
    const text = won ? node.onWin : node.onLoseText;
    if(node.onComplete){ node.onComplete(won); return; }
    showInlineResult({eyebrow:"전투 결과", title:node.enemy.name+" — 결착"}, withName(text, state.playerName));
  }

  // =========================================================
  // 도입부(INTRO) — 1회성

          { label:"정중히 거절한다", tag:"독행", effects:{의리:1}, result:"방주는 아쉬워하면서도 호탕하게 웃었다. \"언제든 환영이오.\"" },
        ]},
      ]},
      { id:"g3", repeatable:true, weight:2, condition:()=>state.sect==="개방", nodes:[
        { type:"text", eyebrow:"개방 총타", body:["거지들과 어울리며 강호 곳곳의 소식을 주고받았다."] },
      ], effects:{의리:2, 명성:1} },
      { id:"g4", repeatable:true, weight:2, nodes:[
        { type:"text", eyebrow:"개방 총타", body:["개방도들 사이에서 떠도는 소문을 들었다."] },
      ], effects:{clues:1} },
    ],
    hwasan: buildSectEvents("hwasan","화산","화산 매화검수",36,7,
      "장문인이 말했다. \"화산의 검은 매화처럼 매섭고 아름답다. 배워보겠는가?\"",
      "매화검법의 초식을 하나하나 되짚으며 검을 갈고닦았다."),
    emei: buildSectEvents("emei","아미","아미 여협",34,6,
      "사태(師太)가 말했다. \"아미의 무공은 부드러움 속에 강함을 품는다.\"",
      "아미의 검법과 지법을 함께 익히며 마음을 다스렸다."),
    kunlun: buildSectEvents("kunlun","곤륜","곤륜 검객",36,7,
      "장로가 말했다. \"곤륜은 속세를 멀리하나, 그대의 눈빛은 다르군.\"",
      "설산의 매서운 바람 속에서 내식을 단련했다."),
    zhongnan: buildSectEvents("zhongnan","종남","종남 제자",32,6,
      "장문인이 말했다. \"종남은 협(俠)을 무엇보다 앞세운다.\"",
      "종남의 문인들과 함께 의협의 도리를 배웠다."),
    qingcheng: buildSectEvents("qingcheng","청성","청성 검수",35,7,
      "장로가 말했다. \"청성의 검은 안개처럼 스며들어 벤다.\"",
      "안개 속에서 검을 휘두르며 초식을 다듬었다."),
    dianchang: buildSectEvents("dianchang","점창","점창 도객",34,7,
      "문주가 말했다. \"점창의 도법은 실전에서 태어났다.\"",
      "실전적인 도법을 반복하며 몸에 새겼다."),
    kongtong: buildSectEvents("kongtong","공동","공동 장법사",35,6,
      "장문인이 말했다. \"공동의 장법은 예측할 수 없는 변화를 품는다.\"",
      "변화무쌍한 장법을 익히며 손끝의 감각을 키웠다."),
  };

  let pendingResultOverride = null;

  function weightedPickEvent(pool){
    const eligible = pool.filter(e=>{
      if(e.condition && !e.condition()) return false;
      if(e.once && state.usedEvents.includes(e.id)) return false;
      return true;
    }).filter(e=> pool.length<=1 || e.id !== state.lastEventId[state.location]);
    if(eligible.length===0) return null;
    const weighted = [];
    eligible.forEach(e=>{ const w=e.weight||1; for(let i=0;i<w;i++) weighted.push(e); });
    return pick(weighted);
  }

  function explore(){
    const locId = state.location;
    const pool = EVENT_POOLS[locId] || [];
    let ev = weightedPickEvent(pool);
    state.turn++;

    if(ev && ev.dynamicCombat){
      startScene(makeWildCombat(), ()=>{ persistSave(); renderHub(); });
      state.usedEvents.push(ev.id+"_"+state.turn);
      state.lastEventId[locId] = ev.id;
      return;
    }
    if(!ev){
      const f = fallbackEvent();
      applyEffects(f.effects);
      startScene(f.nodes, ()=>{ persistSave(); renderHub(); });
      return;
    }
    state.lastEventId[locId] = ev.id;
    if(ev.once) state.usedEvents.push(ev.id);
    if(ev.effects) applyEffects(ev.effects);

    // __DYNAMIC__ 결과 치환 처리
    const nodes = ev.nodes.map(n=>{
      if(n.type!=="choice") return n;
      return Object.assign({}, n, { options: n.options.map(o=>{
        if(o.result !== "__DYNAMIC__") return o;
        return Object.assign({}, o, { get result(){ return pendingResultOverride || "특별한 일은 없었다."; } });
      })});
    });
    startScene(nodes, ()=>{ pendingResultOverride=null; persistSave(); renderHub(); });
  }

  // =========================================================
  // 허브(지역 메인) 화면
  // =========================================================
  function renderHub(){
    state.screen = "hub";
    fadeCard();
    const loc = LOCATIONS[state.location];
    sealEl.textContent = state.sect ? state.sect[0] : "俠";
    const canGoRevenge = state.flags.canConfront && !state.flags.revengeDone;

    cardEl.innerHTML = `
      <div class="chapter-eyebrow">${loc.name} · 제${state.turn}보</div>
      <h2 class="chapter-title">${loc.name}</h2>
      <div class="loc-desc">${loc.desc}</div>
      ${badgeRowHTML()}
      ${statsRowHTML()}
      <div class="actions">
        <button class="btn primary" id="exploreBtn">이 지역 둘러보기</button>
        <button class="btn ghost" id="travelBtn">다른 지역으로 이동</button>
        <button class="btn ghost" id="skillsBtn">무공서고 (${state.skills.length})</button>
        ${canGoRevenge ? '<button class="btn danger-btn" id="revengeBtn">⚔ 흑풍채로 향한다 — 원수를 친다</button>' : ''}
      </div>
    `;
    document.getElementById('exploreBtn').onclick = ()=>{ sfx.click(); explore(); };
    document.getElementById('travelBtn').onclick = ()=>{ sfx.click(); renderTravel(); };
    document.getElementById('skillsBtn').onclick = ()=>{ sfx.click(); renderSkills(); };
    if(canGoRevenge) document.getElementById('revengeBtn').onclick = ()=>{ sfx.click(); startRevenge(); };
  }

  function renderTravel(){
    fadeCard(); sealEl.textContent="行";
    const dests = LOCATION_ORDER.filter(id=>id!==state.location);
    cardEl.innerHTML = `
      <div class="chapter-eyebrow">이동</div>
      <h2 class="chapter-title">어디로 향할 것인가</h2>
      <div class="actions" id="destList"></div>
      <div class="actions"><button class="btn ghost" id="backToHub">뒤로</button></div>
    `;
    const wrap = document.getElementById('destList');
    dests.forEach(id=>{
      const l = LOCATIONS[id];
      const b = document.createElement('button'); b.className='btn';
      b.innerHTML = `${l.name}<small>${l.desc}</small>`;
      b.onclick = ()=>{
        sfx.click(); state.location = id; state.turn++;
        startScene([{ type:"text", eyebrow:"이동", body:[`${l.name}(으)로 향하는 길, ${l.desc}`] }], ()=>{ persistSave(); renderHub(); });
      };
      wrap.appendChild(b);
    });
    document.getElementById('backToHub').onclick=()=>{ sfx.click(); renderHub(); };
  }

  function renderSkills(){
    fadeCard(); sealEl.textContent="武";
    cardEl.innerHTML = `
      <div class="chapter-eyebrow">무공서고</div>
      <h2 class="chapter-title">익힌 무공</h2>
      <div id="skillList"></div>
      <div class="actions"><button class="btn ghost" id="backToHub2">뒤로</button></div>
    `;
    const wrap = document.getElementById('skillList');
    if(state.skills.length===0){
      wrap.innerHTML = `<div class="empty-note">아직 익힌 무공이 없다. 강호를 떠돌다 보면 기연을 만날 것이다.</div>`;
    } else {
      state.skills.forEach(id=>{
        const s = SKILLS[id];
        const div = document.createElement('div'); div.className='skill-item';
        div.innerHTML = `<div class="sname">${s.name}</div><div class="sdesc">${s.desc}</div>`;
        wrap.appendChild(div);
      });
    }
    document.getElementById('backToHub2').onclick=()=>{ sfx.click(); renderHub(); };
  }

  // =========================================================
  // 복수 퀘스트라인 (흑풍채)
  // =========================================================
  function startRevenge(){
    const nodes = [
      { type:"text", eyebrow:"흑풍채", title:"원수의 근거지", body:[
        "흑풍채의 본거지, 불타버린 청운문의 옛터. 그 안쪽에서 사마경이 무환을 기다리고 있었다.",
        "\"결국 여기까지 왔구나, 청운문의 마지막 핏줄.\" 사마경이 차갑게 웃었다."
      ]},
      { type:"text", eyebrow:"흑풍채", body:[
        "\"청운문주는 나의 사제였다. 하지만 그는 문주 자리를 놓고 나를 밀어냈지. 그날 밤 나는 그저… 되찾으러 갔을 뿐이다.\"",
        "무환은 아무 말도 하지 않았다. 대신 단전 깊숙한 곳의 내식을 끌어올렸다."
      ]},
      { type:"combat", enemy:{name:"흑풍채 정예 호위", hp:38, atk:7}, onWin:"정예 호위들마저 무너지자, 사마경의 낯빛이 처음으로 흔들렸다.", onLoseText:"무환은 큰 부상을 입었지만, 이를 악물고 다시 일어섰다." },
      { type:"text", eyebrow:"흑풍채", body:["\"제법이구나.\" 사마경이 검을 고쳐 잡았다. \"하지만 여기까지다.\""] },
      { type:"combat", enemy:{name:"흑풍채주 사마경", hp:58, atk:9},
        onComplete:(won)=>{
          state.flags.revengeDone = true; state.flags.revengeWon = won;
          const text = won ? revengeWinText() : revengeLoseText();
          showInlineResult({eyebrow:"흑풍채", title: won ? "결착" : "패퇴"}, withName(text, state.playerName));
          const nb = document.getElementById('nextBtn');
          if(nb) nb.onclick = ()=>{ sfx.click(); persistSave(); renderHub(); };
        }
      },
    ];
    startScene(nodes, ()=>{ persistSave(); renderHub(); });
  }
  function revengeWinText(){
    const s = state.stats;
    const top = Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];
    const map = {
      내공:"사마경은 무너졌다. 무환은 명예도 세력도 취하지 않고 조용히 강호를 떠돌기 시작했다 — 이제 그는 은둔의 고수로 불린다.",
      무공:"사마경은 무너졌다. 무환의 검은 그 누구도 넘볼 수 없는 경지에 이르렀다 — 이제 그는 천하의 검객으로 불린다.",
      명성:"사마경은 무너졌다. 무환의 이름은 강호 전역에 울려 퍼졌다 — 이제 그는 풍운아로 불린다.",
      의리:"사마경은 무너졌다. 무환의 곁에는 늘 동료들이 함께했다 — 이제 그는 강호의 큰형님으로 불린다.",
    };
    return (map[top]||map.무공) + " 청운문의 원한은 풀렸지만, 강호에서의 그의 이야기는 아직 끝나지 않았다.";
  }
  function revengeLoseText(){
    return "무환은 결국 사마경을 넘어서지 못하고 물러났다. 하지만 목숨은 건졌다 — 언젠가 다시, 더 강해진 모습으로 이곳을 찾으리라.";
  }

  // 복수 완료/실패 후 흑풍채 지역을 잠금 해제하고 이후 재도전 또는 후일담 노출
  function refreshHeukpungLocation(){
    if(state.flags.canConfront){
      if(!LOCATION_ORDER.includes("heukpungchae")) LOCATION_ORDER.push("heukpungchae");
      LOCATIONS.heukpungchae.desc = state.flags.revengeDone
        ? (state.flags.revengeWon ? "이제는 옛 흑풍채의 터. 무환의 전설이 시작된 곳이다." : "원수 사마경의 근거지. 아직 끝내지 못한 싸움이 남아있다.")
        : "원수 사마경의 근거지. 산 그림자 속에 숨겨진 검은 채책.";
    }
  }

  // clues가 목표에 도달하면 confront 플래그 on (explore 이후 체크)
  const _origApplyEffects = applyEffects;
  applyEffects = function(effects){
    _origApplyEffects(effects);
    if(state.clues >= CLUE_TARGET && !state.flags.canConfront){
      state.flags.canConfront = true;
      refreshHeukpungLocation();
    }
  };

  // ---------- 부팅 ----------
  gearBtn.onclick = ()=>{ sfx.click(); openSettings(); };
  applySettings();
  renderTitle();

})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
